[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-map-matching-hmm"
version = "0.1.0"
description = "GPS map matching with a hidden Markov model and Viterbi decoding on a metric road graph (RT03)."
requires-python = ">=3.11"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "networkx==3.7",
    "shapely==2.2.0",
    "geopandas==1.2.0",
    "osmnx==2.2.0",
    "contextily==1.7.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "jupytext==1.17.3", "nbconvert==7.16.6", "nbclient==0.10.2", "ipykernel==6.30.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
